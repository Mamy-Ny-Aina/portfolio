name: Vérification et déploiement

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Vérification et construction
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  deploy:
    name: Déploiement sur Cloudflare
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Secrets Cloudflare présents ?
        id: check
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT"; else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::Ajoutez CLOUDFLARE_API_TOKEN et CLOUDFLARE_ACCOUNT_ID pour activer le déploiement automatique."; fi
      - uses: actions/checkout@v4
        if: steps.check.outputs.ok == 'true'
      - uses: actions/setup-node@v4
        if: steps.check.outputs.ok == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.check.outputs.ok == 'true'
      - run: npm run build
        if: steps.check.outputs.ok == 'true'
      - run: npx wrangler d1 migrations apply DB --remote
        if: steps.check.outputs.ok == 'true'
      - run: npx wrangler deploy
        if: steps.check.outputs.ok == 'true'
